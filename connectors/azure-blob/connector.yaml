apiVersion: ingestron.connector/v1
id: azure-blob
version: 2.1.10
description: Reviewed local snapshots from Azure Blob or ADLS Gen2 files
connector: singer:azure-blob@23.0.1
documentation: https://github.com/ingestron/connectors/blob/main/docs/azure-blob.md
upstream:
  ecosystem: singer
  variant: ingestron
  package: pyarrow
  version: 23.0.1
  repository: https://github.com/apache/arrow
  licence: Apache-2.0
  licenceFile: connectors/azure-blob/UPSTREAM-LICENSE.txt
  licenceStatus: evidenced
runtime:
  path: connectors/azure-blob/runtime.json
  sha256: 3dcb205acb84266621a432cdc314ce869e8cac6c2ded36b0a6b8edbbc26b43ef
  contract: ingestron.snapshot/python/v1
quality:
  library:
    nullValues: at-load
    missingValues: at-load
    invalidValues: at-load
    duplicateValues: at-load
    rowCount: at-load
  sql: unsupported
  engines: []
source:
  kind: azure-blob
  capabilities:
    - snapshot
    - discovery
  reference:
    docs: https://github.com/ingestron/connectors/blob/main/docs/azure-blob.md
    vendorStatus: not-applicable
    licence: Apache-2.0; upstream pyarrow Apache-2.0
    cost:
      model: none
      pricing: https://azure.microsoft.com/pricing/details/storage/blobs/
      note: Azure Storage read and egress charges apply
    access:
      model: subscription
      url: https://learn.microsoft.com/azure/storage/blobs/
      note: An existing storage account and a read-only SAS token
    auth:
      - sas
    network:
      - public
    maturity: preview
    verified: 2026-09-30
    note:
      Conformance suite and installed runs against a loopback server only; no
      live storage account
definition:
  settingsSchema:
    type: object
    properties:
      account:
        type: string
        minLength: 3
        maxLength: 24
      container:
        type: string
        minLength: 3
        maxLength: 63
      sas_token:
        type: object
        properties:
          $secret:
            type: object
            properties:
              env:
                type: string
                minLength: 1
            required:
              - env
            additionalProperties: false
        required:
          - $secret
        additionalProperties: false
    required:
      - account
      - container
      - sas_token
    additionalProperties: false
  selectionSchema:
    type: object
    additionalProperties:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        fields:
          type: object
          additionalProperties:
            type: object
            properties:
              type:
                type: string
                enum:
                  - integer
                  - string
                  - boolean
                  - number
                  - decimal
                  - json
                  - date
                  - timestamp
              nullable:
                type: boolean
              target:
                type: string
                minLength: 1
              precision:
                type: integer
              scale:
                type: integer
            required:
              - type
              - nullable
            additionalProperties: false
      required:
        - name
        - fields
      additionalProperties: false
  tableSourceSchema:
    type: object
    properties:
      path:
        type: string
        minLength: 1
        maxLength: 1024
      format:
        type: string
        enum:
          - csv
          - tsv
          - json
          - jsonl
          - parquet
    required:
      - path
      - format
    additionalProperties: false
execution:
  local:
    modes:
      - local
    evidence: Bounded Azure Blob reads into local snapshots, several tables per
      connection; source-only HTTPS SAS access
sourceAccess:
  apiVersion: ingestron.source-access/v1
  entryPoint: remote_file_access.py
  inventoryScopeSchema:
    type: object
    properties:
      prefix:
        type: string
        maxLength: 1024
        title: Object prefix
        description:
          List files whose paths begin with this literal prefix, including
          subfolders.
      format:
        type: string
        enum:
          - all
          - csv
          - tsv
          - json
          - jsonl
          - parquet
        title: File format
    additionalProperties: false
  metadataOptionsSchema:
    type: object
    description: Explicitly read JSON/JSONL records to suggest a draft schema.
      Samples do not prove required fields, keys or full-file validity. No
      record values are saved in discovery receipts.
    properties:
      sampleRecords:
        type: boolean
        enum:
          - true
        title: Sample JSON records
      limit:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
        title: Record limit
    required:
      - sampleRecords
    additionalProperties: false
  actions:
    - test
    - sample
    - inventory
    - metadata
