apiVersion: ingestron.connector/v1
id: azure-blob
version: 1.3.0
description: Reviewed local snapshots from one Azure Blob or ADLS Gen2 file
connector: singer:azure-blob@23.0.1
documentation: https://github.com/ingestron/connectors/blob/main/docs/azure-blob.md
upstream:
  ecosystem: singer
  variant: ingestron
  package: pyarrow
  version: 23.0.1
  repository: https://github.com/apache/arrow
  licence: Apache-2.0
  licenceFile: connectors/azure-blob/UPSTREAM-LICENSE.txt
  licenceStatus: evidenced
runtime:
  path: connectors/azure-blob/runtime.json
  sha256: 81a710e2a35412fc53c12f8e6366b78f5c3fb7f2d8d9815e3cb9f2801c693bf2
  contract: ingestron.snapshot/python/v1
quality:
  library:
    nullValues: at-load
    missingValues: at-load
    invalidValues: at-load
    duplicateValues: at-load
    rowCount: at-load
  sql: unsupported
  engines: []
source:
  kind: azure-blob
  capabilities:
    - snapshot
    - discovery
  reference:
    docs: https://github.com/ingestron/connectors/blob/main/docs/azure-blob.md
    vendorStatus: not-applicable
    licence: Apache-2.0; upstream pyarrow Apache-2.0
    cost:
      model: none
      pricing: https://azure.microsoft.com/pricing/details/storage/blobs/
      note: Azure Storage read and egress charges apply
    access:
      model: subscription
      url: https://learn.microsoft.com/azure/storage/blobs/
      note: An existing storage account and a read-only SAS token
    auth:
      - sas
    network:
      - public
    maturity: preview
    verified: 2026-09-30
    note: Tested against a loopback server only; no live storage account
definition:
  settingsSchema:
    type: object
    properties:
      account:
        type: string
        minLength: 3
        maxLength: 24
      container:
        type: string
        minLength: 3
        maxLength: 63
      blob:
        type: string
        minLength: 1
        maxLength: 1024
      sas_token:
        type: object
        properties:
          $secret:
            type: object
            properties:
              env: &a1
                type: string
                minLength: 1
            required:
              - env
            additionalProperties: false
        required:
          - $secret
        additionalProperties: false
      format:
        type: string
        enum:
          - csv
          - tsv
          - json
          - jsonl
          - parquet
      types:
        type: object
        additionalProperties:
          type: string
          enum:
            - string
            - integer
            - decimal
            - number
            - boolean
    required:
      - account
      - container
      - blob
      - sas_token
      - format
    additionalProperties: false
  selectionSchema:
    type: object
    additionalProperties:
      type: object
      properties:
        name: *a1
        fields:
          type: object
          additionalProperties:
            type: object
            properties:
              type:
                type: string
                enum:
                  - integer
                  - string
                  - boolean
                  - number
                  - decimal
                  - json
              nullable:
                type: boolean
              target:
                type: string
                minLength: 1
              precision:
                type: integer
              scale:
                type: integer
            required:
              - type
              - nullable
            additionalProperties: false
      required:
        - name
        - fields
      additionalProperties: false
execution:
  local:
    modes:
      - local
    evidence: Bounded Azure Blob read into local snapshots; source-only HTTPS SAS access
