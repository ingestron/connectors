apiVersion: ingestron.connector/v1
id: onedrive
version: 0.1.11
description: Reviewed local snapshots of OneDrive files through Microsoft Graph
connector: singer:onedrive@23.0.1
documentation: https://github.com/ingestron/connectors/blob/main/docs/onedrive.md
upstream:
  ecosystem: singer
  variant: ingestron
  package: pyarrow
  version: 23.0.1
  repository: https://github.com/apache/arrow
  licence: Apache-2.0
  licenceFile: connectors/onedrive/UPSTREAM-LICENSE.txt
  licenceStatus: evidenced
runtime:
  path: connectors/onedrive/runtime.json
  sha256: f0c9393625f578e41cd66836cec3ee2b00e55d17c5ae49d8ce8438bf8dae8419
  contract: ingestron.snapshot/python/v1
quality:
  library:
    nullValues: at-load
    missingValues: at-load
    invalidValues: at-load
    duplicateValues: at-load
    rowCount: at-load
  sql: unsupported
  engines: []
source:
  kind: onedrive
  capabilities:
    - snapshot
    - discovery
  reference:
    docs: https://github.com/ingestron/connectors/blob/main/docs/onedrive.md
    vendorStatus: not-applicable
    licence: Apache-2.0; upstream pyarrow Apache-2.0; HTTPS through the Python
      standard library
    cost:
      model: none
      note: Microsoft Graph file reads carry no separate charge; Microsoft 365
        licensing applies
    access:
      model: subscription
      url: https://learn.microsoft.com/graph/api/resources/onedrive
      note:
        A Microsoft 365 tenant and an Entra app with Files.Read.All application
        permission
    auth:
      - client-credentials
    network:
      - public
    maturity: preview
    verified: 2026-09-30
    note: OneDrive for Business files and folders through Microsoft Graph v1.0;
      conformance and unit tests against a Graph mock only; no live tenant
definition:
  settingsSchema:
    type: object
    properties:
      tenant_id: &a1
        type: string
        minLength: 36
        maxLength: 36
      client_id: *a1
      client_secret:
        type: object
        properties:
          $secret:
            type: object
            properties:
              env:
                type: string
                minLength: 1
            required:
              - env
            additionalProperties: false
        required:
          - $secret
        additionalProperties: false
      user:
        type: string
        minLength: 3
        maxLength: 320
    required:
      - tenant_id
      - client_id
      - client_secret
      - user
    additionalProperties: false
  selectionSchema:
    type: object
    additionalProperties:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        fields:
          type: object
          additionalProperties:
            type: object
            properties:
              type:
                type: string
                enum:
                  - integer
                  - string
                  - boolean
                  - number
                  - decimal
                  - json
                  - date
                  - timestamp
              nullable:
                type: boolean
              target:
                type: string
                minLength: 1
              precision:
                type: integer
              scale:
                type: integer
            required:
              - type
              - nullable
            additionalProperties: false
      required:
        - name
        - fields
      additionalProperties: false
  tableSourceSchema:
    type: object
    properties:
      path:
        type: string
        minLength: 1
        maxLength: 1024
      format:
        type: string
        enum:
          - csv
          - tsv
          - json
          - jsonl
          - parquet
    required:
      - path
      - format
    additionalProperties: false
execution:
  local:
    modes:
      - local
    evidence:
      Read-only Microsoft Graph file reads with app-only credentials; unit
      tests against a Graph mock
sourceAccess:
  apiVersion: ingestron.source-access/v1
  entryPoint: folder_access.py
  inventoryScopeSchema:
    type: object
    properties:
      directory:
        type: string
        maxLength: 1024
        title: Folder
        description: Leave blank for the drive root, or enter one relative folder.
      format:
        type: string
        enum:
          - all
          - csv
          - tsv
          - json
          - jsonl
          - parquet
        title: File format
    additionalProperties: false
  metadataOptionsSchema:
    type: object
    description: Explicitly read JSON/JSONL records to suggest a draft schema.
      Samples do not prove required fields, keys or full-file validity. No
      record values are saved in discovery receipts.
    properties:
      sampleRecords:
        type: boolean
        enum:
          - true
        title: Sample JSON records
      limit:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
        title: Record limit
    required:
      - sampleRecords
    additionalProperties: false
  actions:
    - test
    - sample
    - inventory
    - metadata
