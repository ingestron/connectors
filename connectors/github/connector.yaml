apiVersion: ingestron.connector/v1
id: github
version: 1.33.1
description: github customer-operated full snapshot connector
connector: singer:github@1.29.2
documentation: https://github.com/ingestron/connectors/blob/main/docs/github.md
upstream:
  ecosystem: singer
  variant: meltanolabs
  package: meltanolabs-tap-github
  version: 1.29.2
  repository: https://github.com/MeltanoLabs/tap-github
  licence: Apache-2.0
  licenceFile: connectors/github/UPSTREAM-LICENSE.txt
  licenceStatus: evidenced
runtime:
  path: connectors/github/runtime.json
  sha256: c281b7af0c90376c0bef390ae308b1c24453a0ad1583d9c4b92bb2393580251b
  contract: ingestron.snapshot/python/v1
definition:
  settingsSchema:
    type: object
    properties:
      authentication:
        type: string
        enum:
          - anonymous
          - token
      auth_token:
        type: object
        properties:
          $secret:
            type: object
            properties:
              env:
                type: string
                minLength: 1
            required:
              - env
            additionalProperties: false
        required:
          - $secret
        additionalProperties: false
      repositories:
        type: array
        items:
          type: string
          minLength: 3
        minItems: 1
        maxItems: 10
    required:
      - repositories
    additionalProperties: false
  selectionSchema:
    type: object
    additionalProperties:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        fields:
          type: object
          additionalProperties:
            type: object
            properties:
              type:
                type: string
                enum:
                  - integer
                  - string
                  - boolean
                  - number
                  - decimal
                  - json
              nullable:
                type: boolean
              target:
                type: string
                minLength: 1
              precision:
                type: integer
              scale:
                type: integer
            required:
              - type
              - nullable
            additionalProperties: false
      required:
        - name
        - fields
      additionalProperties: false
execution:
  local:
    modes:
      - local
    evidence: Synthetic REST/authentication/failure qualification and bounded
      anonymous public repository read; no performance guarantee; local provider
      installed-package qualification
