apiVersion: ingestron.connector/v1
id: github
version: 1.35.0
description: github customer-operated full snapshot connector
connector: singer:github@1.29.2
documentation: https://github.com/ingestron/connectors/blob/main/docs/github.md
upstream:
  ecosystem: singer
  variant: meltanolabs
  package: meltanolabs-tap-github
  version: 1.29.2
  repository: https://github.com/MeltanoLabs/tap-github
  licence: Apache-2.0
  licenceFile: connectors/github/UPSTREAM-LICENSE.txt
  licenceStatus: evidenced
runtime:
  path: connectors/github/runtime.json
  sha256: b526b127c5118994c8464f7c3e4c83547f19381ddb943c0032e6c2dc93ea437f
  contract: ingestron.snapshot/python/v1
quality:
  library:
    nullValues: at-load
    missingValues: at-load
    invalidValues: at-load
    duplicateValues: at-load
    rowCount: at-load
  sql: unsupported
  engines: []
source:
  kind: github
  capabilities:
    - snapshot
    - discovery
  reference:
    docs: https://github.com/ingestron/connectors/blob/main/docs/github.md
    vendorStatus: not-applicable
    licence: Apache-2.0; upstream MeltanoLabs tap-github Apache-2.0
    cost:
      model: none
      note: GitHub API rate limits apply
    access:
      model: free
      url: https://docs.github.com/rest
      note: Public repositories anonymously; a token for private repositories
    auth:
      - anonymous
      - token
    network:
      - public
    maturity: verified
    verified: 2026-09-30
    note: A bounded anonymous live run against a public repository passed
definition:
  settingsSchema:
    type: object
    properties:
      authentication:
        type: string
        enum:
          - anonymous
          - token
      auth_token:
        type: object
        properties:
          $secret:
            type: object
            properties:
              env:
                type: string
                minLength: 1
            required:
              - env
            additionalProperties: false
        required:
          - $secret
        additionalProperties: false
      repositories:
        type: array
        items:
          type: string
          minLength: 3
        minItems: 1
        maxItems: 10
    required:
      - repositories
    additionalProperties: false
  selectionSchema:
    type: object
    additionalProperties:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        fields:
          type: object
          additionalProperties:
            type: object
            properties:
              type:
                type: string
                enum:
                  - integer
                  - string
                  - boolean
                  - number
                  - decimal
                  - json
              nullable:
                type: boolean
              target:
                type: string
                minLength: 1
              precision:
                type: integer
              scale:
                type: integer
            required:
              - type
              - nullable
            additionalProperties: false
      required:
        - name
        - fields
      additionalProperties: false
execution:
  local:
    modes:
      - local
    evidence: Synthetic REST/authentication/failure qualification and bounded
      anonymous public repository read; no performance guarantee; local provider
      installed-package qualification
