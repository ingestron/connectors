apiVersion: ingestron.connector/v1
id: mysql
version: 1.0.0
description: Reviewed local snapshots from MySQL and MariaDB tables
connector: singer:mysql@1.2.3
documentation: https://github.com/ingestron/connectors/blob/main/docs/mysql.md
upstream:
  ecosystem: singer
  variant: ingestron
  package: PyMySQL
  version: 1.2.3
  repository: https://github.com/PyMySQL/PyMySQL
  licence: MIT
  licenceFile: connectors/mysql/UPSTREAM-LICENSE.txt
  licenceStatus: evidenced
runtime:
  path: connectors/mysql/runtime.json
  sha256: dcfdb69d435491d7d7fcb005fb0761f4b832b8795295730a5f51d13e9a12f272
  contract: ingestron.snapshot/python/v1
quality:
  library:
    nullValues: at-load
    missingValues: at-load
    invalidValues: at-load
    duplicateValues: at-load
    rowCount: at-load
  sql: unsupported
  engines: []
source:
  kind: mysql
  capabilities:
    - snapshot
    - discovery
  reference:
    docs: https://github.com/ingestron/connectors/blob/main/docs/mysql.md
    vendorStatus: not-applicable
    licence: Apache-2.0; upstream PyMySQL MIT
    cost:
      model: none
      note: Database compute and egress charges apply
    access:
      model: free
      url: https://dev.mysql.com/downloads/mysql/
      note: MySQL Community Server is free; any existing server
    auth:
      - password
    network:
      - public
      - private-network
      - on-premises
    maturity: verified
    verified: 2026-09-30
    note:
      MySQL and MariaDB tables through a pure-Python driver; conformance suite
      passed against a local MySQL and MariaDB container
definition:
  settingsSchema:
    type: object
    properties:
      connection:
        type: object
        properties:
          host:
            type: string
            minLength: 1
            maxLength: 253
          port:
            type: integer
            minimum: 1
            maximum: 65535
          database: &a1
            type: string
            minLength: 1
            maxLength: 128
          user: *a1
          password:
            type: object
            properties:
              $secret:
                type: object
                properties:
                  env: &a2
                    type: string
                    minLength: 1
                required:
                  - env
                additionalProperties: false
            required:
              - $secret
            additionalProperties: false
          tls:
            type: string
            enum:
              - require
              - disable
        required:
          - host
          - database
          - user
          - password
        additionalProperties: false
    required:
      - connection
    additionalProperties: false
  selectionSchema:
    type: object
    additionalProperties:
      type: object
      properties:
        name: *a2
        fields:
          type: object
          additionalProperties:
            type: object
            properties:
              type:
                type: string
                enum:
                  - integer
                  - string
                  - boolean
                  - number
                  - decimal
                  - json
              nullable:
                type: boolean
              target:
                type: string
                minLength: 1
              precision:
                type: integer
              scale:
                type: integer
            required:
              - type
              - nullable
            additionalProperties: false
      required:
        - name
        - fields
      additionalProperties: false
  tableSourceSchema:
    type: object
    properties:
      schema: *a1
      table: *a1
    required:
      - schema
      - table
    additionalProperties: false
execution:
  local:
    modes:
      - local
    evidence:
      Bounded read-only table snapshot; conformance suite against synthetic
      fakes and local containers
