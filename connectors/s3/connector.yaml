apiVersion: ingestron.connector/v1
id: s3
version: 1.0.0
description: Reviewed local snapshots of Amazon S3 objects
connector: singer:s3@23.0.1
documentation: https://github.com/ingestron/connectors/blob/main/docs/s3.md
upstream:
  ecosystem: singer
  variant: ingestron
  package: pyarrow
  version: 23.0.1
  repository: https://github.com/apache/arrow
  licence: Apache-2.0
  licenceFile: connectors/s3/UPSTREAM-LICENSE.txt
  licenceStatus: evidenced
runtime:
  path: connectors/s3/runtime.json
  sha256: 3a01d8ef2a5f23ff4e32e57013629f4b2f54c4f3b0ffd750ae02b925e5753c56
  contract: ingestron.snapshot/python/v1
quality:
  library:
    nullValues: at-load
    missingValues: at-load
    invalidValues: at-load
    duplicateValues: at-load
    rowCount: at-load
  sql: unsupported
  engines: []
source:
  kind: s3
  capabilities:
    - snapshot
    - discovery
  reference:
    docs: https://github.com/ingestron/connectors/blob/main/docs/s3.md
    vendorStatus: not-applicable
    licence:
      Apache-2.0; upstream pyarrow Apache-2.0; SigV4 signing with the Python
      standard library
    cost:
      model: none
      pricing: https://aws.amazon.com/s3/pricing/
      note: S3 request and data transfer charges apply
    access:
      model: subscription
      url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/
      note:
        An AWS account and an access key with s3:ListBucket and s3:GetObject;
        S3-compatible stores through endpoint
    auth:
      - access-key
    network:
      - public
    maturity: verified
    verified: 2026-10-01
    note:
      Conformance suite against an S3-compatible server (SeaweedFS) in a local
      container that verifies SigV4 signatures; not yet against AWS itself
definition:
  settingsSchema:
    type: object
    properties:
      bucket:
        type: string
        minLength: 3
        maxLength: 63
      region:
        type: string
        minLength: 4
        maxLength: 32
      access_key_id:
        type: string
        minLength: 1
        maxLength: 256
      secret_access_key: &a1
        type: object
        properties:
          $secret:
            type: object
            properties:
              env: &a2
                type: string
                minLength: 1
            required:
              - env
            additionalProperties: false
        required:
          - $secret
        additionalProperties: false
      session_token: *a1
      endpoint:
        type: string
        minLength: 8
        maxLength: 300
    required:
      - bucket
      - region
      - access_key_id
      - secret_access_key
    additionalProperties: false
  selectionSchema:
    type: object
    additionalProperties:
      type: object
      properties:
        name: *a2
        fields:
          type: object
          additionalProperties:
            type: object
            properties:
              type:
                type: string
                enum:
                  - integer
                  - string
                  - boolean
                  - number
                  - decimal
                  - json
              nullable:
                type: boolean
              target:
                type: string
                minLength: 1
              precision:
                type: integer
              scale:
                type: integer
            required:
              - type
              - nullable
            additionalProperties: false
      required:
        - name
        - fields
      additionalProperties: false
  tableSourceSchema:
    type: object
    properties:
      path:
        type: string
        minLength: 1
        maxLength: 1024
      format:
        type: string
        enum:
          - csv
          - tsv
          - json
          - jsonl
          - parquet
    required:
      - path
      - format
    additionalProperties: false
execution:
  local:
    modes:
      - local
    evidence: SigV4-signed S3 API reads; conformance suite against a mock and
      against an S3-compatible server in a local container
