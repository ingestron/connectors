apiVersion: ingestron.connector/v1
id: hubspot
version: 0.1.8
description: Reviewed local snapshots of HubSpot CRM objects
connector: singer:hubspot@23.0.1
documentation: https://github.com/ingestron/connectors/blob/main/docs/hubspot.md
upstream:
  ecosystem: singer
  variant: ingestron
  package: pyarrow
  version: 23.0.1
  repository: https://github.com/apache/arrow
  licence: Apache-2.0
  licenceFile: connectors/hubspot/UPSTREAM-LICENSE.txt
  licenceStatus: evidenced
runtime:
  path: connectors/hubspot/runtime.json
  sha256: a5bc71ecb24bbaefd3fa5291202f9a2ccb8eb833f7359b59a0941868915e6846
  contract: ingestron.snapshot/python/v1
quality:
  library:
    nullValues: at-load
    missingValues: at-load
    invalidValues: at-load
    duplicateValues: at-load
    rowCount: at-load
  sql: unsupported
  engines: []
source:
  kind: hubspot
  capabilities:
    - snapshot
    - discovery
  reference:
    docs: https://github.com/ingestron/connectors/blob/main/docs/hubspot.md
    vendorStatus: not-applicable
    licence: Apache-2.0; HTTPS through the Python standard library
    cost:
      model: none
      note: HubSpot API use has no separate charge; plan limits apply
    access:
      model: free-tier
      url: https://developers.hubspot.com/docs/apps/legacy-apps/private-apps/overview
      note: A HubSpot account with a private app token and CRM read scopes
    auth:
      - private-app-token
    network:
      - public
    maturity: preview
    verified: 2026-10-01
    note:
      CRM v3 objects and properties; daily API limits apply; conformance suite
      against a mock of the documented API only; no live account
definition:
  settingsSchema:
    type: object
    properties:
      access_token:
        type: object
        properties:
          $secret:
            type: object
            properties:
              env:
                type: string
                minLength: 1
            required:
              - env
            additionalProperties: false
        required:
          - $secret
        additionalProperties: false
    required:
      - access_token
    additionalProperties: false
  selectionSchema:
    type: object
    additionalProperties:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        fields:
          type: object
          additionalProperties:
            type: object
            properties:
              type:
                type: string
                enum:
                  - integer
                  - string
                  - boolean
                  - number
                  - decimal
                  - json
                  - date
                  - timestamp
              nullable:
                type: boolean
              target:
                type: string
                minLength: 1
              precision:
                type: integer
              scale:
                type: integer
            required:
              - type
              - nullable
            additionalProperties: false
      required:
        - name
        - fields
      additionalProperties: false
  tableSourceSchema:
    type: object
    properties:
      object:
        type: string
        minLength: 1
        maxLength: 80
    required:
      - object
    additionalProperties: false
execution:
  local:
    modes:
      - local
    evidence:
      HubSpot CRM v3 API (properties and objects); conformance suite against
      a mock of the documented API
sourceAccess:
  apiVersion: ingestron.source-access/v1
  entryPoint: source_access.py
  actions:
    - test
    - sample
    - inventory
    - metadata
