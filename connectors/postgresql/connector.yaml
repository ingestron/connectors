apiVersion: ingestron.connector/v1
id: postgresql
version: 1.1.10
description: Reviewed local snapshots from PostgreSQL tables
connector: singer:postgresql@1.31.5
documentation: https://github.com/ingestron/connectors/blob/main/docs/postgresql.md
upstream:
  ecosystem: singer
  variant: ingestron
  package: pg8000
  version: 1.31.5
  repository: https://github.com/tlocke/pg8000
  licence: BSD-3-Clause
  licenceFile: connectors/postgresql/UPSTREAM-LICENSE.txt
  licenceStatus: evidenced
runtime:
  path: connectors/postgresql/runtime.json
  sha256: 646696f81a637043d5e0c5df52748b6c64c0227c08f93708c89d7cd372b93fe9
  contract: ingestron.snapshot/python/v1
quality:
  library:
    nullValues: at-load
    missingValues: at-load
    invalidValues: at-load
    duplicateValues: at-load
    rowCount: at-load
  sql: unsupported
  engines: []
source:
  kind: postgresql
  capabilities:
    - snapshot
    - discovery
  reference:
    docs: https://github.com/ingestron/connectors/blob/main/docs/postgresql.md
    vendorStatus: not-applicable
    licence: Apache-2.0; upstream pg8000 BSD-3-Clause
    cost:
      model: none
      note: Database compute and egress charges apply
    access:
      model: free
      url: https://www.postgresql.org/download/
      note: PostgreSQL is free; any existing server
    auth:
      - password
    network:
      - public
      - private-network
      - on-premises
    maturity: verified
    verified: 2026-09-30
    note:
      PostgreSQL tables through a pure-Python driver; conformance suite passed
      against a local PostgreSQL container
definition:
  settingsSchema:
    type: object
    properties:
      connection:
        type: object
        properties:
          host:
            type: string
            minLength: 1
            maxLength: 253
          port:
            type: integer
            minimum: 1
            maximum: 65535
          database: &a1
            type: string
            minLength: 1
            maxLength: 128
          user: *a1
          password:
            type: object
            properties:
              $secret:
                type: object
                properties:
                  env:
                    type: string
                    minLength: 1
                required:
                  - env
                additionalProperties: false
            required:
              - $secret
            additionalProperties: false
          tls:
            type: string
            enum:
              - require
              - disable
        required:
          - host
          - database
          - user
          - password
        additionalProperties: false
    required:
      - connection
    additionalProperties: false
  selectionSchema:
    type: object
    additionalProperties:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        fields:
          type: object
          additionalProperties:
            type: object
            properties:
              type:
                type: string
                enum:
                  - integer
                  - string
                  - boolean
                  - number
                  - decimal
                  - json
                  - date
                  - timestamp
              nullable:
                type: boolean
              target:
                type: string
                minLength: 1
              precision:
                type: integer
              scale:
                type: integer
            required:
              - type
              - nullable
            additionalProperties: false
      required:
        - name
        - fields
      additionalProperties: false
  tableSourceSchema:
    type: object
    properties:
      schema: *a1
      table: *a1
      incremental:
        type: object
        properties:
          watermark: *a1
          initial:
            type: integer
            minimum: 0
            maximum: 9007199254740991
          batchSize:
            type: integer
            minimum: 1
            maximum: 1000000
          consistency:
            type: string
            enum:
              - ordered-committed-append
        required:
          - watermark
          - initial
          - consistency
        additionalProperties: false
    required:
      - schema
      - table
    additionalProperties: false
execution:
  local:
    modes:
      - local
    evidence:
      Bounded read-only table snapshot; conformance suite against synthetic
      fakes and local containers
sourceAccess:
  apiVersion: ingestron.source-access/v1
  entryPoint: source_access.py
  actions:
    - test
    - sample
    - inventory
    - metadata
