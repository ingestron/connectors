apiVersion: ingestron.connector/v1
id: files
version: 1.5.13
description: Reviewed snapshots from local CSV, TSV, JSON, JSONL and Parquet files
connector: singer:files@23.0.1
documentation: https://github.com/ingestron/connectors/blob/main/docs/files.md
upstream:
  ecosystem: singer
  variant: ingestron
  package: pyarrow
  version: 23.0.1
  repository: https://github.com/apache/arrow
  licence: Apache-2.0
  licenceFile: connectors/files/UPSTREAM-LICENSE.txt
  licenceStatus: evidenced
runtime:
  path: connectors/files/runtime.json
  sha256: dfb6fb84c4259a621d7e0ee5943b806d3736b46a06e8c5fc2523ef2d86d20fe5
  contract: ingestron.snapshot/python/v1
  metadataDocuments: ingestron.metadata-documents/v1
quality:
  library:
    nullValues: at-load
    missingValues: at-load
    invalidValues: at-load
    duplicateValues: at-load
    rowCount: at-load
  sql: unsupported
  engines: []
source:
  kind: local-files
  capabilities:
    - snapshot
    - discovery
  reference:
    docs: https://github.com/ingestron/connectors/blob/main/docs/files.md
    vendorStatus: not-applicable
    licence: Apache-2.0; upstream pyarrow Apache-2.0
    cost:
      model: none
    access:
      model: none
      note: Files on the machine running the flow
    auth: []
    network:
      - local
    maturity: verified
    verified: 2026-09-30
    note: Installed runs read real CSV, TSV, JSON, JSONL and Parquet files
definition:
  settingsSchema:
    type: object
    properties: {}
    required: []
    additionalProperties: false
  selectionSchema:
    type: object
    additionalProperties:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        fields:
          type: object
          additionalProperties:
            type: object
            properties:
              type:
                type: string
                enum:
                  - integer
                  - string
                  - boolean
                  - number
                  - decimal
                  - json
                  - date
                  - timestamp
              nullable:
                type: boolean
              target:
                type: string
                minLength: 1
              precision:
                type: integer
              scale:
                type: integer
            required:
              - type
              - nullable
            additionalProperties: false
      required:
        - name
        - fields
      additionalProperties: false
  tableSourceSchema:
    type: object
    properties:
      path:
        type: string
        minLength: 1
      format:
        type: string
        enum:
          - csv
          - tsv
          - json
          - jsonl
          - parquet
    required:
      - path
      - format
    additionalProperties: false
execution:
  local:
    modes:
      - local
    evidence: Bounded local file snapshot; release qualification records format,
      review, rejection and retry checks
sourceAccess:
  apiVersion: ingestron.source-access/v1
  entryPoint: files_access.py
  inventoryScopeSchema:
    type: object
    properties:
      directory:
        type: string
        minLength: 1
        maxLength: 4000
      format:
        type: string
        enum:
          - all
          - csv
          - tsv
          - json
          - jsonl
          - parquet
    required:
      - directory
    additionalProperties: false
  metadataOptionsSchema:
    type: object
    description: Explicitly read JSON/JSONL records to suggest a draft schema.
      Samples do not prove required fields, keys or full-file validity. No
      record values are saved in discovery receipts.
    properties:
      sampleRecords:
        type: boolean
        enum:
          - true
        title: Sample JSON records
      limit:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
        title: Record limit
    required:
      - sampleRecords
    additionalProperties: false
  actions:
    - test
    - sample
    - inventory
    - metadata
