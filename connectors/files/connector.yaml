apiVersion: ingestron.connector/v1
id: files
version: 1.4.0
description: Reviewed snapshots from local CSV, TSV, JSON, JSONL and Parquet files
connector: singer:files@23.0.1
documentation: https://github.com/ingestron/connectors/blob/main/docs/files.md
upstream:
  ecosystem: singer
  variant: ingestron
  package: pyarrow
  version: 23.0.1
  repository: https://github.com/apache/arrow
  licence: Apache-2.0
  licenceFile: connectors/files/UPSTREAM-LICENSE.txt
  licenceStatus: evidenced
runtime:
  path: connectors/files/runtime.json
  sha256: e22fe99f72503895d2d4a4d4ce3b4535da19340b6411d4d537ba3d08d08ed71f
  contract: ingestron.snapshot/python/v1
quality:
  library:
    nullValues: at-load
    missingValues: at-load
    invalidValues: at-load
    duplicateValues: at-load
    rowCount: at-load
  sql: unsupported
  engines: []
source:
  kind: local-files
  capabilities:
    - snapshot
    - discovery
  reference:
    docs: https://github.com/ingestron/connectors/blob/main/docs/files.md
    vendorStatus: not-applicable
    licence: Apache-2.0; upstream pyarrow Apache-2.0
    cost:
      model: none
    access:
      model: none
      note: Files on the machine running the flow
    auth: []
    network:
      - local
    maturity: verified
    verified: 2026-09-30
    note: Installed runs read real CSV, TSV, JSON, JSONL and Parquet files
definition:
  settingsSchema:
    type: object
    properties: {}
    required: []
    additionalProperties: false
  selectionSchema:
    type: object
    additionalProperties:
      type: object
      properties:
        name: &a1
          type: string
          minLength: 1
        fields:
          type: object
          additionalProperties:
            type: object
            properties:
              type:
                type: string
                enum:
                  - integer
                  - string
                  - boolean
                  - number
                  - decimal
                  - json
              nullable:
                type: boolean
              target:
                type: string
                minLength: 1
              precision:
                type: integer
              scale:
                type: integer
            required:
              - type
              - nullable
            additionalProperties: false
      required:
        - name
        - fields
      additionalProperties: false
  tableSourceSchema:
    type: object
    properties:
      path: *a1
      format:
        type: string
        enum:
          - csv
          - tsv
          - json
          - jsonl
          - parquet
    required:
      - path
      - format
    additionalProperties: false
execution:
  local:
    modes:
      - local
    evidence: Bounded local file snapshot; release qualification records format,
      review, rejection and retry checks
