apiVersion: ingestron.connector/v1
id: sql-server
version: 1.5.0
description: Reviewed local snapshots from multiple SQL Server or Azure SQL tables
connector: singer:sql-server@1.15.0
documentation: https://github.com/ingestron/connectors/blob/main/docs/sql-server.md
upstream:
  ecosystem: singer
  variant: ingestron
  package: mssql-python
  version: 1.15.0
  repository: https://github.com/microsoft/mssql-python
  licence: MIT (driver); bundled ODBC binary under Microsoft terms
  licenceFile: connectors/sql-server/UPSTREAM-LICENSE.txt
  licenceStatus: evidenced
runtime:
  path: connectors/sql-server/runtime.json
  sha256: df9575e4e62fea46bcbca253aff15d2e46be53bd4421a2ed6311233300c7f88b
  contract: ingestron.snapshot/python/v1
quality:
  library:
    nullValues: at-load
    missingValues: at-load
    invalidValues: at-load
    duplicateValues: at-load
    rowCount: at-load
  sql: unsupported
  engines: []
source:
  kind: sql-server
  capabilities:
    - snapshot
    - discovery
  reference:
    docs: https://github.com/ingestron/connectors/blob/main/docs/sql-server.md
    vendorStatus: not-applicable
    licence: Apache-2.0; upstream mssql-python MIT, bundled ODBC binary under
      Microsoft terms
    cost:
      model: none
      note: Database compute and egress charges apply
    access:
      model: free
      url: https://www.microsoft.com/sql-server/sql-server-downloads
      note: SQL Server Developer edition or an existing SQL Server or Azure SQL
        database
    auth:
      - sql-password
      - entra-default
      - entra-managed-identity
      - entra-service-principal
    network:
      - public
      - private-network
      - on-premises
    maturity: verified
    verified: 2026-09-30
    note: Conformance suite passed against SQL Server 2022 Developer in a local
      container (certificate trust relaxed for the test only); an earlier
      release read Northwind live
definition:
  settingsSchema:
    type: object
    properties:
      connection:
        type: object
        properties:
          server:
            type: string
            minLength: 1
            maxLength: 253
          database: &a1
            type: string
            minLength: 1
            maxLength: 128
          port:
            type: integer
            minimum: 1
            maximum: 65535
          authentication:
            oneOf:
              - type: object
                properties:
                  method:
                    type: string
                    enum:
                      - sql-password
                  username: *a1
                  password: &a2
                    type: object
                    properties:
                      $secret:
                        type: object
                        properties:
                          env: &a3
                            type: string
                            minLength: 1
                        required:
                          - env
                        additionalProperties: false
                    required:
                      - $secret
                    additionalProperties: false
                required:
                  - method
                  - username
                  - password
                additionalProperties: false
              - type: object
                properties:
                  method:
                    type: string
                    enum:
                      - entra-default
                required:
                  - method
                additionalProperties: false
              - type: object
                properties:
                  method:
                    type: string
                    enum:
                      - entra-managed-identity
                  client_id: *a1
                required:
                  - method
                additionalProperties: false
              - type: object
                properties:
                  method:
                    type: string
                    enum:
                      - entra-service-principal
                  client_id: *a1
                  client_secret: *a2
                required:
                  - method
                  - client_id
                  - client_secret
                additionalProperties: false
        required:
          - server
          - database
          - authentication
        additionalProperties: false
    required:
      - connection
    additionalProperties: false
  selectionSchema:
    type: object
    additionalProperties:
      type: object
      properties:
        name: *a3
        fields:
          type: object
          additionalProperties:
            type: object
            properties:
              type:
                type: string
                enum:
                  - integer
                  - string
                  - boolean
                  - number
                  - decimal
                  - json
              nullable:
                type: boolean
              target:
                type: string
                minLength: 1
              precision:
                type: integer
              scale:
                type: integer
            required:
              - type
              - nullable
            additionalProperties: false
      required:
        - name
        - fields
      additionalProperties: false
  tableSourceSchema:
    type: object
    properties:
      schema: *a1
      table: *a1
    required:
      - schema
      - table
    additionalProperties: false
execution:
  local:
    modes:
      - local
    evidence: Bounded read-only table snapshot; SQL password live Northwind
      qualification and synthetic authentication/negative-path checks
