apiVersion: ingestron.connector/v1
id: sharepoint
version: 0.1.0
description: Reviewed local snapshots of SharePoint files through Microsoft Graph
connector: singer:sharepoint@23.0.1
documentation: https://github.com/ingestron/connectors/blob/main/docs/sharepoint.md
upstream:
  ecosystem: singer
  variant: ingestron
  package: pyarrow
  version: 23.0.1
  repository: https://github.com/apache/arrow
  licence: Apache-2.0
  licenceFile: connectors/sharepoint/UPSTREAM-LICENSE.txt
  licenceStatus: evidenced
runtime:
  path: connectors/sharepoint/runtime.json
  sha256: df251d81f38f24969633046934bbbc5a6e4d093a3a0a32c1050489b61cba0918
  contract: ingestron.snapshot/python/v1
quality:
  library:
    nullValues: at-load
    missingValues: at-load
    invalidValues: at-load
    duplicateValues: at-load
    rowCount: at-load
  sql: unsupported
  engines: []
source:
  kind: sharepoint
  capabilities:
    - snapshot
    - discovery
  reference:
    docs: https://github.com/ingestron/connectors/blob/main/docs/sharepoint.md
    vendorStatus: not-applicable
    licence: Apache-2.0; upstream pyarrow Apache-2.0; HTTPS through the Python
      standard library
    cost:
      model: none
      note: Microsoft Graph file reads carry no separate charge; Microsoft 365
        licensing applies
    access:
      model: subscription
      url: https://learn.microsoft.com/graph/api/resources/onedrive
      note: A Microsoft 365 tenant and an Entra app with Sites.Selected or
        Sites.Read.All application permission
    auth:
      - client-credentials
    network:
      - public
    maturity: preview
    verified: 2026-09-30
    note: SharePoint document library files and folders through Microsoft Graph
      v1.0; conformance and unit tests against a Graph mock only; no live tenant
definition:
  settingsSchema:
    type: object
    properties:
      tenant_id: &a1
        type: string
        minLength: 36
        maxLength: 36
      client_id: *a1
      client_secret:
        type: object
        properties:
          $secret:
            type: object
            properties:
              env: &a2
                type: string
                minLength: 1
            required:
              - env
            additionalProperties: false
        required:
          - $secret
        additionalProperties: false
      site:
        type: string
        minLength: 30
        maxLength: 300
    required:
      - tenant_id
      - client_id
      - client_secret
      - site
    additionalProperties: false
  selectionSchema:
    type: object
    additionalProperties:
      type: object
      properties:
        name: *a2
        fields:
          type: object
          additionalProperties:
            type: object
            properties:
              type:
                type: string
                enum:
                  - integer
                  - string
                  - boolean
                  - number
                  - decimal
                  - json
              nullable:
                type: boolean
              target:
                type: string
                minLength: 1
              precision:
                type: integer
              scale:
                type: integer
            required:
              - type
              - nullable
            additionalProperties: false
      required:
        - name
        - fields
      additionalProperties: false
  tableSourceSchema:
    type: object
    properties:
      path:
        type: string
        minLength: 1
        maxLength: 1024
      format:
        type: string
        enum:
          - csv
          - tsv
          - json
          - jsonl
          - parquet
    required:
      - path
      - format
    additionalProperties: false
execution:
  local:
    modes:
      - local
    evidence: Read-only Microsoft Graph file reads with app-only credentials;
      conformance suite against a Graph mock
