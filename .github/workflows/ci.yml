name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: npm install --global pnpm@10.15.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm runtime:prepare
      - run: pnpm validate
      - run: python -m venv build/sql-server
      - run: build/sql-server/bin/python -m pip install --require-hashes --index-url https://pypi.org/simple -r runtime/sql-server.lock
      - run: build/sql-server/bin/python -c 'import mssql_python, pyarrow; print("SQL driver and Arrow import passed")'
      - run: build/sql-server/bin/python -m unittest discover -s test/runtime -p test_sql_server.py -v
      - run: git diff --exit-code -- connectors
      - run: pnpm acceptance
      - run: pnpm acceptance:files
      - run: pnpm acceptance:files:tables
      - run: pnpm package:retail
      - run: pnpm acceptance:retail
      - run: pnpm acceptance:azure-blob
