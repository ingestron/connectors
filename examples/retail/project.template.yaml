apiVersion: ingestron.project/v1
id: retail_files
packages:
  local: local@0.4.1
  files: files@1.1.0
providers:
  configurations:
    local:
      package: local
      binding: runtime
defaults:
  provider: local
environments:
  dev:
    apiVersion: ingestron.environment/v1
    environment: dev
    bindings:
      runtime:
        kind: local
connections:
  retail_files:
    package: files
    sourceId: retail
    tenantId: training
    settings: {}
flows:
  - apiVersion: ingestron.flow/v1
    kind: ingestion
    id: retail_local
    provider: local
    ingestion:
      connection: retail_files
      timeoutSeconds: 120
      execution:
        mode: local
    tables:
      customers:
        source:
          path: __CUSTOMERS_PATH__
          format: __FORMAT__
        contract:
          $resolve: ./contracts/customers.odcs.yaml
      products:
        source:
          path: __PRODUCTS_PATH__
          format: __FORMAT__
        contract:
          $resolve: ./contracts/products.odcs.yaml
      orders:
        source:
          path: __ORDERS_PATH__
          format: __FORMAT__
        contract:
          $resolve: ./contracts/orders.odcs.yaml
